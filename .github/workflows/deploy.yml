name: Deploy site

# The site is served from the gh-pages branch, which until now was published by
# running `npm run deploy` by hand. This builds and publishes it on every push
# to main instead. `npm run deploy` still works locally and is unchanged.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race to force-push gh-pages.
concurrency:
  group: deploy-gh-pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # The oral history audio in public/audio is tracked with Git LFS.
          # Without this the checkout yields ~133-byte pointer stubs, which
          # build and publish cleanly but serve as unplayable garbage.
          lfs: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify Git LFS assets resolved
        run: |
          if grep -rlq "git-lfs.github.com/spec" dist/audio 2>/dev/null; then
            echo "::error::Audio assets are still Git LFS pointer stubs; refusing to publish a broken Oral History page."
            grep -rl "git-lfs.github.com/spec" dist/audio
            exit 1
          fi
          echo "Audio assets resolved to real files."

      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Bypass Jekyll processing on the published branch.
          touch dist/.nojekyll
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The published tree is around 7 MB once the Git LFS audio is checked
          # out as real files, and it is pushed as a fresh orphan history every
          # run, so there is no delta for the server to reuse. Git's default
          # 1 MB post buffer chunks a pack that size over HTTP/2, and the first
          # run died with "RPC failed; HTTP 408" and "unexpected disconnect
          # while reading sideband packet". A large buffer over HTTP/1.1 sends
          # it as one request instead.
          git config http.postBuffer 524288000
          git config http.version HTTP/1.1

          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA} from ${GITHUB_REF_NAME}"

          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            if git push -f "$remote" gh-pages; then
              echo "Published to gh-pages on attempt ${attempt}."
              exit 0
            fi
            echo "::warning::Push attempt ${attempt} failed; retrying."
            sleep $(( attempt * 15 ))
          done
          echo "::error::Could not push the built site to gh-pages after 3 attempts."
          exit 1
